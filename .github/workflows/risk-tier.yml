name: Risk tier
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: export GITHUB_TOKEN= GIT_TERMINAL_PROMPT=0 PR_NUMBER="${{ github.event.pull_request.number }}" && git init . && git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" && git fetch --depth 1 origin "pull/${PR_NUMBER}/head" && git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: GITHUB_TOKEN= npm ci && GITHUB_TOKEN= npm test
  tier:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          if [ -f scripts/risk-tier.mjs ] && [ -f risk-tiers ]; then npm ci && node scripts/risk-tier.mjs; exit; fi
          node --input-type=module -e 'import fs from "node:fs"; const b=String(JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")).pull_request.body??""); const h=b.match(/^## Risk tier\s*$/m); const rest=h?b.slice(h.index+h[0].length):""; const n=rest.search(/^## /m); const s=h?(n<0?rest:rest.slice(0,n)):""; const c=[...s.matchAll(/^[ \t]*(?:[-*+]|\d+\.)\s+\[([xX])\]\s+high(?![\w-])/gm)]; console.log("base has no scripts/risk-tier.mjs or risk-tiers"); console.log("computed high"); if(c.length!==1){console.error("Claimed risk tier is missing or lower than computed tier high."); process.exit(1)} console.log("claimed high")'
